name: Release Please

on:
  workflow_run:
    workflows:
      - unit-test
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  release-please:
    # The branches filter matches the branch of the triggering run, so a fork
    # whose head branch is called main would otherwise reach this job.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    uses: muleyuck/github-actions/.github/workflows/release-please.yml@v1
    with:
      path: crates/tray-app

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: muleyuck/github-actions/actions/rust/setup@v1

      - name: Build the app
        run: make app

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" "target/turnray-${VERSION}.zip" --clobber --repo "$GITHUB_REPOSITORY"

      # Only after the zip is attached, so the Cask never points at a missing file.
      - name: Render the Cask
        run: |
          sha=$(shasum -a 256 "target/turnray-${VERSION}.zip" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/Casks"
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@SHA256@/${sha}/" packaging/turnray.rb.in \
            > "$RUNNER_TEMP/Casks/turnray.rb"
          brew style "$RUNNER_TEMP/Casks/turnray.rb"

      - name: Get a token for the tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: muleyuck
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muleyuck/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Publish the Cask
        working-directory: tap
        run: |
          mkdir -p Casks
          cp "$RUNNER_TEMP/Casks/turnray.rb" Casks/turnray.rb
          git add Casks/turnray.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "turnray ${VERSION}"
          git push
