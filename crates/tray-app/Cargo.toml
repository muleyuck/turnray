[package]
name = "tray-app"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "turnray"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
png = "0.18.1"
tao = "0.35.3"
tokio = { version = "1.53.0", features = ["rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.24.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSData", "NSGeometry", "NSNotification", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSPanel",
    "NSParagraphStyle",
    "NSResponder",
    "NSScreen",
    "NSScrollView",
    "NSStackView",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
