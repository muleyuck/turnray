      <stop offset="0" stop-color="#2A2F57"/><stop offset="1" stop-color="#151830"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="236" y="262" width="400" height="92" rx="46" fill="#343B69"/>
  <rect x="236" y="670" width="300" height="92" rx="46" fill="#343B69"/>
