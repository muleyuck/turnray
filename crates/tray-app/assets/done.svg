<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <title>done</title>
  <!-- A check punched out of a filled square, so it reads at 18pt as one solid mark. -->
  <defs>
    <mask id="check">
      <rect width="22" height="22" fill="white"/>
      <path d="M6.2 11.4L9.6 14.8L15.8 7.6" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="18" height="18" rx="4" fill="currentColor" mask="url(#check)"/>
</svg>
