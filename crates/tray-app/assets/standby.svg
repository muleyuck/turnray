<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <title>standby</title>
  <!-- The app mark on its own: no agent, nobody's turn. Two queued bars and a third that
       turns up out of the line, punched out of a rounded square. The bars still waiting
       are half punched, so at 18pt they read as faint lines rather than as letters. -->
  <defs>
    <mask id="tile">
      <rect width="22" height="22" fill="white"/>
      <g fill="#999"><rect x="4.4" y="4.6" width="7.6" height="2.6" rx="1.3"/><rect x="4.4" y="14.8" width="5.6" height="2.6" rx="1.3"/></g><path d="M5.7 11H12.6A2.9 2.9 0 0 0 15.5 8.1V5.9" fill="none" stroke="black" stroke-width="2.6" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="20" height="20" rx="5" fill="currentColor" mask="url(#tile)"/>
</svg>
